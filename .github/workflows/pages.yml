# Publie le site Jàng sur GitHub Pages à chaque push sur main.
# Réglages une seule fois dans le dépôt :
#   Settings → Pages → Source : GitHub Actions
#   Settings → Secrets and variables → Actions → onglet Variables → CORRIGER_URL
#     = https://<id-projet>.supabase.co/functions/v1/corriger   (URL publique, pas un secret)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Voie 2 seulement : ne tourne que si la variable CORRIGER_URL est définie (sinon : voie 1 Cloudflare)
    if: ${{ vars.CORRIGER_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm et non bun : le bun.lock de Lovable pointe vers un registre privé
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
          PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_CORRIGER_URL: ${{ vars.CORRIGER_URL }}
      # Pages inconnues → coquille de l'application (le routeur prend le relais)
      - run: cp dist/client/_shell.html dist/client/404.html && touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
